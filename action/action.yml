name: 'TestPilot QA'
description: 'Analyze Playwright locator quality and emit SARIF for GitHub code scanning.'
author: 'faisal1024'
branding:
  icon: 'check-circle'
  color: 'green'

# This action is a thin wrapper around the `testpilot-qa` CLI — it does not
# duplicate any analysis logic. It runs `testpilot analyze` with your inputs,
# writes a SARIF file (so findings appear as code-scanning annotations), and
# adds the human report to the job summary. Pair it with
# github/codeql-action/upload-sarif to publish the annotations (see README).
#
# Note: this runs the published `testpilot-qa` package via npx, so it needs the
# package to be available on npm. For unpublished/local use, call the CLI directly.

inputs:
  version:
    description: 'testpilot-qa version or npm dist-tag to run.'
    required: false
    default: 'latest'
  patterns:
    description: 'Optional glob(s) to analyze, separated by spaces, tabs or newlines, and matched by the CLI (quotes are not honoured, so a path cannot contain a space). Defaults to the configured test dir.'
    required: false
    default: ''
  min-score:
    description: 'Fail if the Locator Quality Score is below this value (0-100).'
    required: false
    default: ''
  baseline:
    description: 'Path to a baseline file; fail only on new findings.'
    required: false
    default: ''
  output:
    description: 'SARIF output path.'
    required: false
    default: 'testpilot.sarif'
  working-directory:
    description: >-
      Directory to run in. NOTE: SARIF file paths are emitted relative to this
      directory. For code-scanning annotations to land on the right files, keep
      this at the repo root, or pass a matching `checkout_path`/`sourceRoot` to
      github/codeql-action/upload-sarif.
    required: false
    default: '.'
  node-version:
    description: 'Node.js version to set up before running.'
    required: false
    default: '20'

outputs:
  sarif:
    description: 'Path to the generated SARIF file.'
    value: ${{ steps.analyze.outputs.sarif }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - id: analyze
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TP_VERSION: ${{ inputs.version }}
        TP_PATTERNS: ${{ inputs.patterns }}
        TP_MIN_SCORE: ${{ inputs.min-score }}
        TP_BASELINE: ${{ inputs.baseline }}
        TP_OUTPUT: ${{ inputs.output }}
      run: |
        set -uo pipefail
        echo "sarif=${TP_OUTPUT}" >> "${GITHUB_OUTPUT}"

        # The inputs shared by both runs (the baseline scopes the report to new findings).
        common=(analyze)
        # Split on whitespace (spaces, tabs, and newlines, so a YAML `|` block
        # with one glob per line works) — with pathname expansion OFF. Unquoted,
        # bash also globbed each pattern against the runner's files before the
        # CLI saw it: without globstar `**` means `*`, so `tests/**/*.spec.ts`
        # became a partial file list and the gate silently covered files nobody
        # chose. `set -f` keeps the splitting and drops only the globbing; `read
        # -a` would have split too, but stops at the first newline and silently
        # drops every line after it — the same bug in a new place.
        # Appended straight onto `common`, never via an intermediate array: a
        # whitespace-only input splits to nothing, and expanding an EMPTY array
        # under `set -u` crashes on bash < 4.4 (stock macOS `/bin/bash` on a
        # self-hosted runner). `common` always holds `analyze`, so it is never empty.
        if [ -n "${TP_PATTERNS}" ]; then
          set -f
          # shellcheck disable=SC2206 # word-splitting wanted; globbing disabled above
          common+=(${TP_PATTERNS})
          set +f
        fi
        [ -n "${TP_BASELINE}" ] && common+=(--baseline "${TP_BASELINE}")

        # PR-friendly summary first — the human report. Never fails the build.
        {
          echo "## TestPilot QA"
          echo ""
          echo '```'
          npx --yes "testpilot-qa@${TP_VERSION}" "${common[@]}" 2>&1 || true
          echo '```'
        } >> "${GITHUB_STEP_SUMMARY}"

        # The gate last: writes SARIF and enforces the score threshold. Its exit
        # code becomes the step's exit code (SARIF is written even when it fails,
        # so a later upload-sarif step with `if: always()` still works).
        gate=("${common[@]}")
        [ -n "${TP_MIN_SCORE}" ] && gate+=(--min-score "${TP_MIN_SCORE}")
        gate+=(--reporter sarif --output "${TP_OUTPUT}")
        npx --yes "testpilot-qa@${TP_VERSION}" "${gate[@]}"
