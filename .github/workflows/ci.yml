name: CI

on:
  pull_request: {}
  push:
    branches: [main]
  # The release job calls this workflow, so nothing is published that did not
  # pass the same gate a PR does. The Version PR the release workflow opens is
  # created with the workflow's own token, and GitHub runs no workflows for
  # those PRs — without this call, the code that ships is never tested.
  workflow_call: {}

# Read-only, always. When release.yml calls this workflow the jobs would
# otherwise inherit its `contents: write` and `id-token: write` — and npm's
# trusted publisher checks the *calling* workflow's name, so an OIDC token
# minted here could publish. `smoke:package` installs the tarball's runtime
# dependencies from the registry with install scripts on; none of that code
# gets a write token. A called workflow can narrow permissions, never widen.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 stays while `engines` still claims it (end of life April 2026;
        # the floor rises to 22 at beta — Road-to-Beta D6). 22 is what the
        # release job publishes with; 24 is current.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          # `changeset status` compares against main, which needs its history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Both smokes run the BUILT CLI; `smoke:package` installs the packed
      # tarball as a consumer would. Neither ran in CI before, so a broken
      # package could pass every check here.
      - run: pnpm smoke:mvp
      - run: pnpm smoke:package
      # A user-facing change needs a changeset. `@testpilot/ai` changed in four
      # PRs without one, so its guidance changes reached no release note.
      # Exempt: Dependabot PRs (it never writes changesets — keyed on the PR's
      # author, not `github.actor`, which becomes whoever last pushed or
      # clicked "Update branch"), and the Version PR, which *consumes*
      # changesets rather than adding one.
      - name: Changeset present
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since=origin/main
