name: bench

# The corpus benchmark is the tool's own no-regression gate: it runs the built CLI
# against pinned commits of real Playwright suites and fails when the evidence of
# analysis narrows (fewer files, fewer locator call sites, more parse errors). It
# clones from the network and takes minutes, so it is not on the PR path — it runs
# weekly and on demand.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Run the corpus benchmark
        # `shell: bash` to get pipefail: without it the step takes tee's exit status
        # and the gate can never turn this job red. stderr carries the per-repo lines
        # and the validation failures, so it goes into the summary too.
        shell: bash
        run: pnpm bench 2>&1 | tee bench-output.md
      - name: Publish the comparison
        if: always()
        shell: bash
        run: cat bench-output.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results.json
          if-no-files-found: warn
